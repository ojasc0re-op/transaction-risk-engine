name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fraud_detection
          POSTGRES_USER: fraud_user
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/fraud_detection
          DB_USERNAME: fraud_user
          DB_PASSWORD: changeme
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ProductionGradeSecretKeyForRunningGitHubActionsWorkflowsAtLeast256BitsLong!
        run: mvn clean verify -B

      - name: Package JAR
        run: mvn package -DskipTests -B

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fraud-detection-platform-jar
          path: target/fraud-detection-platform-*.jar
          retention-days: 7
