spring:
  application:
    name: fraud-detection-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud_detection}
    username: ${DB_USERNAME:fraud_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTThatShouldBeAtLeast256BitsLongInProduction}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  risk:
    scoring:
      large-transaction-score: 20
      frequency-anomaly-score: 20
      new-device-score: 15
      location-anomaly-score: 25
      suspicious-ip-score: 20
      high-risk-merchant-score: 15
      failed-transaction-score: 10
    thresholds:
      large-transaction-multiplier: 3.0
      frequency-window-minutes: 60
      frequency-max-count: 10
      location-distance-km: 500.0
      failed-transaction-window-minutes: 30
      failed-transaction-max-count: 3
    levels:
      low-max: 29
      medium-max: 59
      high-max: 79
    suspicious-ips: ${SUSPICIOUS_IPS:192.168.100.1,10.0.0.1}

  rate-limit:
    requests-per-minute: 60
    window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.frauddetection: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
